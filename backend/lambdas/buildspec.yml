version: 0.2

phases:
  build:
    commands:
      - echo "Building Rust Lambda functions..."
      - cd backend/lambdas

      # Build submit-job Lambda
      - echo "Building submit-job Lambda..."
      - cd submit-job
      - cargo lambda build --release --arm64
      - cd ..

      # Build get-job Lambda
      - echo "Building get-job Lambda..."
      - cd get-job
      - cargo lambda build --release --arm64
      - cd ..

      - echo "Lambda builds complete"

  post_build:
    commands:
      - echo "Creating individual Lambda deployment packages..."

      # Create submit-job.zip
      - cd submit-job/target/lambda/submit-job
      - zip submit-job.zip bootstrap
      - SUBMIT_JOB_UPLOAD=$(aws s3api put-object --bucket ${S3_BUCKET_NAME} --key lambda-artifacts/submit-job.zip --body submit-job.zip --output json)
      - SUBMIT_JOB_VERSION=$(echo "$SUBMIT_JOB_UPLOAD" | python3 -c "import sys, json; print(json.load(sys.stdin)['VersionId'])")
      - echo "submit-job.zip uploaded with version ${SUBMIT_JOB_VERSION}"
      - aws ssm put-parameter --name /pdf-models/lambda/submit-job-version --value ${SUBMIT_JOB_VERSION} --type String --overwrite || echo "Warning Could not update SSM parameter"
      - cd ../../../..

      # Create get-job.zip
      - cd get-job/target/lambda/get-job
      - zip get-job.zip bootstrap
      - GET_JOB_UPLOAD=$(aws s3api put-object --bucket ${S3_BUCKET_NAME} --key lambda-artifacts/get-job.zip --body get-job.zip --output json)
      - GET_JOB_VERSION=$(echo "$GET_JOB_UPLOAD" | python3 -c "import sys, json; print(json.load(sys.stdin)['VersionId'])")
      - echo "get-job.zip uploaded with version ${GET_JOB_VERSION}"
      - aws ssm put-parameter --name /pdf-models/lambda/get-job-version --value ${GET_JOB_VERSION} --type String --overwrite || echo "Warning Could not update SSM parameter"
      - cd ../../../..

      - echo "Lambda artifacts uploaded to S3"

artifacts:
  files:
    # Include the bootstrap binaries from cargo-lambda output
    - backend/lambdas/submit-job/target/lambda/submit-job/bootstrap
    - backend/lambdas/get-job/target/lambda/get-job/bootstrap
  name: rust-lambda-builds