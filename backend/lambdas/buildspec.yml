version: 0.2

phases:
  install:
    commands:
      # Install Rust toolchain
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.83
      - . "$HOME/.cargo/env"
      - rustup target add aarch64-unknown-linux-gnu

      # Install cargo-lambda via cargo (use 1.6.3 which supports Rust 1.80+)
      - cargo install cargo-lambda --version 1.6.3

  build:
    commands:
      - . "$HOME/.cargo/env"
      - echo "Building Rust Lambda functions..."
      - cd backend/lambdas

      # Disable pyenv completely to avoid conflicts with cargo-lambda
      - export PATH=$(echo $PATH | tr ':' '\n' | grep -v pyenv | tr '\n' ':' | sed 's/:$//')
      - unset PYENV_VERSION
      - unset PYENV_ROOT

      # Build submit-job Lambda
      - echo "Building submit-job Lambda..."
      - cd submit-job
      - cargo lambda build --release --arm64
      - cd ..

      # Build get-job Lambda
      - echo "Building get-job Lambda..."
      - cd get-job
      - cargo lambda build --release --arm64
      - cd ..

      - echo "Lambda builds complete"

artifacts:
  files:
    # Include the bootstrap binaries from cargo-lambda output
    - backend/lambdas/submit-job/target/lambda/submit-job/bootstrap
    - backend/lambdas/get-job/target/lambda/get-job/bootstrap
  name: rust-lambda-builds
