version: 0.2

env:
  secrets-manager:
    TEST_USER_EMAIL: "/pdf-models/test-credentials:TEST_USER_EMAIL"
    TEST_USER_PASSWORD: "/pdf-models/test-credentials:TEST_USER_PASSWORD"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"

  pre_build:
    commands:
      - cd backend
      - uv sync
      - uv run python tests/integration/setup_test_user.py "$TEST_USER_EMAIL" "$TEST_USER_PASSWORD"

  build:
    commands:
      - |
        echo "=== DEBUG: Current directory before cd ==="
        pwd
        ls -la
        echo "=== DEBUG: After cd backend ==="
        cd backend
        pwd
        ls -la
        echo "=== DEBUG: Listing tests/ ==="
        ls -la tests/ || echo "tests/ not found"
        echo "=== DEBUG: Listing tests/integration/ ==="
        ls -la tests/integration/ || echo "tests/integration/ not found"
        echo "=== END DEBUG ==="
        if [ -n "$MODEL" ]; then
          uv run pytest tests/integration/test_${MODEL}_e2e.py -v -s --tb=short --junitxml=test-results/integration-results.xml
        else
          uv run pytest tests/integration/ -v -s --tb=short --junitxml=test-results/integration-results.xml
        fi

reports:
  integration-tests:
    files:
      - test-results/integration-results.xml
    base-directory: backend
    file-format: JUNITXML
