version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - curl -LsSf https://astral.sh/uv/install.sh | sh
      - export PATH="$HOME/.local/bin:$PATH"

  build:
    commands:
      - cd backend
      - uv sync
      - uv run pytest tests/unit/ -v --tb=short --junitxml=test-results/unit-results.xml

reports:
  unit-tests:
    files:
      - test-results/unit-results.xml
    base-directory: backend
    file-format: JUNITXML
