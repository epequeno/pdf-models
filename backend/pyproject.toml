[project]
name = "backend"
version = "0.1.0"
description = "CDK infrastructure for pdf-models"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib==2.232.1",
    "constructs>=10.0.0,<11.0.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "boto3>=1.35.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]
